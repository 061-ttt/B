# Cloudflare のかぎが Actions から見えるかだけをすぐ確かめる（中身は表示しない）
name: check-keys
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-keys.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "secrets.CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && '登録あり' || 'なし' }}"
          echo "secrets.CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' && '登録あり' || 'なし' }}"
          echo "vars.CLOUDFLARE_API_TOKEN: ${{ vars.CLOUDFLARE_API_TOKEN != '' && '登録あり' || 'なし' }}"
          echo "vars.CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' && '登録あり' || 'なし' }}"
